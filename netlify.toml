# =====================================================================
# Netlify Configuration - InsightHub Frontend
#
# هذا الملف يخبر Netlify كيف يبني وينشر الموقع.
# عند ربط المستودع بـ Netlify، سيقرأ هذا الملف تلقائياً.
# =====================================================================

[build]
  # الـ Frontend عبارة عن HTML ثابت لا يحتاج build
  command = ""
  publish = "frontend"

# =====================================================================
# Headers أمنية أساسية لكل الصفحات
# =====================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"

# =====================================================================
# Cache طويل للأصول الثابتة (تحسين الأداء)
# =====================================================================
[[headers]]
  for = "/*.html"
  [headers.values]
    # HTML لا نخزّنه طويلاً ليصل التحديث للمستخدم بسرعة
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
